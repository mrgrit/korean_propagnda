# Absolute-power inputs (§1.2): goal, budget, defender strength, ethics level, rounds.
name: p0-default
goal_target: A
goal_margin: 0.05
budget: 3000000
ethics_level: 0.5
rounds: 20
seed: 42
checkpoint_every: 1

promotion:
  k: 500
  k_l3: 100

manipulator:
  mode: rule          # rule | llm  (P1: LLM 전략가가 프레임·주장유형·표적 집단·채널·강도를 고름)

defender:
  enabled: true
  strength: 0.5
  mode: rule          # rule | llm

backend:
  kind: cc            # mock | cc | api   (cc = Claude Code subscription session logged in on THIS machine)
  model: haiku        # L2 judgments on the low-cost model (§2.1)
  concurrency: 6      # parallel `claude -p` workers (I/O bound)
  timeout_s: 120
  max_wait_s: 120     # usage-limit backoff budget per call; beyond this the round is discarded, the run pauses at the last checkpoint and auto-resumes when the window reopens (probe every 10 min)
  thinking_tokens: 0  # MAX_THINKING_TOKENS for the worker; 0 halves latency on haiku
  batch_size: 8       # P1: personas per call (8× fewer calls than one-per-persona)
  strategy_model: sonnet   # P1: manipulator/defender strategist model (2 calls per round)
  # api alternative: {kind: api, model: claude-haiku-4-5, mode: batch, concurrency: 16}
  # dry run:         --backend mock

paths:
  processed_dir: data/processed
