# P0 channels (6 of 11). Propagation params per §4.2. cost_per_impression in
# budget units. correction_trust: multiplier on trust when the channel carries a
# fact-check/correction (defender), relative to persuasion trust.
channels:
  youtube:   {oneway: true,  speed: 0.6, meme: 0.7, closedness: 0.3, cost_per_impression: 1.0, correction_trust: 0.8}
  portal:    {oneway: true,  speed: 0.5, meme: 0.3, closedness: 0.2, cost_per_impression: 1.2, correction_trust: 1.3}
  kakao:     {oneway: false, speed: 0.9, meme: 0.8, closedness: 0.8, cost_per_impression: 0.5, correction_trust: 0.9}
  instagram: {oneway: false, speed: 0.8, meme: 0.9, closedness: 0.4, cost_per_impression: 0.9, correction_trust: 0.7}
  tv:        {oneway: true,  speed: 0.3, meme: 0.1, closedness: 0.1, cost_per_impression: 2.5, correction_trust: 1.5}
  wom:       {oneway: false, speed: 0.7, meme: 0.5, closedness: 0.9, cost_per_impression: 0.2, correction_trust: 1.0}
# frame affinity by age_group (0..5): how well each frame lands per generation (0..1)
frame_affinity:
  economy:    [0.70, 0.75, 0.75, 0.70, 0.65, 0.60]
  security:   [0.35, 0.40, 0.50, 0.62, 0.75, 0.82]
  fairness:   [0.80, 0.72, 0.62, 0.55, 0.50, 0.45]
  welfare:    [0.50, 0.55, 0.55, 0.60, 0.72, 0.80]
  competence: [0.50, 0.55, 0.60, 0.65, 0.68, 0.70]
