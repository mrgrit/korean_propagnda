<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여론장 로그인</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<form class="login-card" method="post" action="/login">
  <h1>여론장 <span class="muted">Opinion Field</span></h1>
  <p class="muted">비밀번호는 서버의 <code>configs/web_auth.yaml</code> 에 있습니다.</p>
  <label>비밀번호 <input type="password" name="password" autofocus autocomplete="current-password"></label>
  <p id="err" class="err" hidden>비밀번호가 틀렸습니다.</p>
  <button type="submit" class="primary">로그인</button>
</form>
<script>if (location.search.includes('err=1')) document.getElementById('err').hidden = false;</script>
</body>
</html>
