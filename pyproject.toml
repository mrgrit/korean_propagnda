[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opinion-field"
version = "0.0.1"
description = "K-Propaganda P0 — adversarial opinion-dynamics simulation engine (manipulator vs defender) over a synthetic Korean voter population"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "polars>=1.0",
  "pyarrow>=15",
  "scipy>=1.10",
  "pyyaml>=6",
  "anthropic>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opinion-field = "opinion_field.cli:main"

[tool.setuptools.packages.find]
include = ["opinion_field*"]

[tool.setuptools.package-data]
"opinion_field.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
